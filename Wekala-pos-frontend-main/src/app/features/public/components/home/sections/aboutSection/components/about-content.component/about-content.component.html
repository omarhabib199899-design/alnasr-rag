<div class="about-content fade-left flex flex-column flex-start gap-20">
    <!-- Section identification badge -->
    <span class="main-content__badge">
        {{ badge() }}
    </span>
    
    <!-- Main section title -->
    <h2 class="about-content__title font-monospace">
        {{ title() }}
    </h2>
    
    <!-- Primary descriptive paragraph -->
    <p class="about-content__description fs-14 text-muted">
        {{ descriptionOne() }}
    </p>
    
    <!-- Supporting descriptive paragraph -->
    <p class="about-content__description fs-14 text-muted">
        {{ descriptionTwo() }}
    </p>
</div>
