<div class="stats-grid grid grid-cols-2 gap-16">
    <!-- Iterate through the statistics list and render a card for each metric -->
    @for(stat of stats(); track stat.title){
        <app-feature-card
            size="sm"
            className="flex flex-col items-start card main-card radius-lg p-16"
            [leading]="stat.value"
            [title]="stat.title">
        </app-feature-card>
    }
</div>
